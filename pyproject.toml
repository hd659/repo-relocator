[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-relocator"
version = "0.1.0"
description = "One-shot project rename/move: sweep stale paths in IDE, Claude/Codex/Pi sessions, git; backup, verify, rollback."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
repo-relocator = "repo_relocator.cli:main"

[tool.setuptools]
packages = ["repo_relocator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
